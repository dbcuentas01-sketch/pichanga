<!--
  Variante a sangre completa, sin esquinas redondeadas.
  iOS redondea el ícono por su cuenta: si ya viniera redondeado,
  se vería un doble borde.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#E13347"/>
      <stop offset="1" stop-color="#A41B2D"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#fondo)"/>

  <g stroke="#FFF3E2" fill="none" opacity="0.34">
    <circle cx="256" cy="318" r="124" stroke-width="17"/>
    <path d="M0,318 H512" stroke-width="17"/>
  </g>
  <ellipse cx="256" cy="372" rx="104" ry="20" fill="#5A0E1C" opacity="0.3"/>

  <circle cx="256" cy="246" r="116" fill="#FBF7EF"/>
  <circle cx="256" cy="246" r="116" fill="none" stroke="#1C1512" stroke-width="13"/>
  <path d="M256,178 L311,218 L290,282 L222,282 L201,218 Z" fill="#1C1512"/>
  <g stroke="#1C1512" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M256,178 L256,136"/>
    <path d="M311,218 L352,205"/>
    <path d="M290,282 L316,317"/>
    <path d="M222,282 L196,317"/>
    <path d="M201,218 L160,205"/>
  </g>
</svg>
